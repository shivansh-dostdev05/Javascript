<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer src="test.js"></script>  // Executing javascript using defer attribute in script tag
    
</head>
<body>
    <h1> This is heading of the webpage</h1>
    <div id="test">

    </div>

</body>
</html>
